 function reviewAccuracy(a){const checked=bank.questions.map((q,i)=>({checked:a.checked?.[i]===true,right:right(q,a.answers[i])})).filter(r=>r.checked),total=checked.length,score=checked.filter(r=>r.right).length;return `<section class="review-accuracy" id="review-accuracy" role="status" aria-live="polite" aria-label="Tỷ lệ đúng Review"><strong>${total?(score/total*100).toLocaleString('vi-VN',{maximumFractionDigits:1})+'% đúng':'—'}</strong><div><span>Đã kiểm tra ${total}/65 · Đúng ${score} · Sai ${total-score}</span><small>${total?'Tỷ lệ tính trên các câu đã kiểm tra.':'Chưa kiểm tra câu nào.'}</small></div></section>`;}
 function renderQuestion(){const a=view==='review'?review:state.active;if(!a||!bank)return;const done=view==='review',revealed=done||untimed(a)&&!!a.checked?.[a.pos],q=bank.questions[a.pos],selected=a.answers[a.pos],complete=a.answers.filter((s,i)=>s.length===bank.questions[i].correct.length).length;const sequence=untimed(a)?a.questionOrder||bank.questions.map((_,i)=>i):bank.questions.map((_,i)=>i),position=sequence.indexOf(a.pos);const shown=sequence.filter(i=>filter==='all'||filter==='flagged'&&a.flags[i]||filter==='empty'&&a.answers[i].length!==bank.questions[i].correct.length||filter==='wrong'&&!right(bank.questions[i],a.answers[i]));
 app.innerHTML=`<main class="exam-room"><header class="exam-top">${done?`<button class="btn quiet" data-exam="result">← Kết quả</button>`:`<a class="brand" href="index.html"><span class="brand-mark">⌘</span><div>Data Quest<small>ĐỀ KIỂM TRA ${a.test}</small></div></a>`}<div class="row wrap">${done?'<span class="pill lime">ĐÃ NỘP · XEM LẠI</span>':`${untimed(a)?`<span class="pill lime">${ultra(a)?'☠️🔥 Ultra Hardcore':hardcore(a)?'🔥 Hardcore · 6 chặng':'Review · Không tính giờ'}</span><button class="btn small quiet" type="button" data-fun="sound" aria-label="Bật hoặc tắt âm báo trả lời"></button>`:'<span class="exam-clock" id="exam-clock" role="timer" aria-label="Thời gian còn lại"></span>'}${hardcore(a)?'<span class="exam-clock" id="exam-clock" role="timer" aria-label="Thời gian Hardcore còn lại"></span>':''}${ultra(a)?'<span class="pill">🔒 Hoàn thành để thoát</span>':'<button class="btn quiet" data-exam="hub">Lưu & thoát</button>'}<button class="btn primary" data-exam="confirm" ${hardcore(a)&&a.checked?.filter(Boolean).length!==65?'disabled':''}>Nộp bài</button>`}</div></header><div class="exam-layout"><section><div class="row between wrap spaced"><span class="eyebrow">ĐỀ ${a.test} · CÂU ${position+1}/65</span><small>${complete}/65 câu đã chọn đủ</small></div>${!done&&hardcore(a)?hardcoreProgress(a):!done&&untimed(a)?reviewAccuracy(a):''}${!done&&a.stageNotice?`<p class="callout spaced" role="status">${esc(a.stageNotice)}</p>`:''}${!done&&hardcore(a)&&a.restartNotice?`<p class="callout spaced" role="alert">${esc(a.restartNotice)}</p>`:''}<article class="question-card spaced">${untimed(a)?window.QuestionNotes?.button(q.question)||'':''}<div class="row between wrap"><span class="pill">Chọn ${q.correct.length} đáp án</span><button class="btn small quiet" data-exam="flag" ${done?'disabled':''}>${a.flags[a.pos]?'⚑ Đã đánh dấu':'⚐ Đánh dấu xem lại'}</button></div><div class="question-text">${content(q.question)}</div><div class="answer-list">${a.order[a.pos].map((n,i)=>`<button class="answer ${revealed?(q.correct.includes(n)?'correct':selected.includes(n)?'wrong':''):selected.includes(n)?'selected':''}" data-exam="answer" data-index="${n}" aria-pressed="${selected.includes(n)}" ${revealed?'disabled':''}><span class="answer-letter">${String.fromCharCode(65+i)}</span><span class="answer-copy">${content(q.answers[n])}${revealed?`<span class="answer-status">${q.correct.includes(n)?'✓ Đáp án đúng':''}${selected.includes(n)?' · Bạn đã chọn':''}</span>`:''}</span></button>`).join('')}</div>${!done&&untimed(a)?`<div class="spaced"><button class="btn primary" data-exam="check" ${revealed||selected.length!==q.correct.length?'disabled':''}>${revealed?'✓ Đã kiểm tra':'✓ Kiểm tra đáp án'}</button><p class="footnote">Chọn đủ ${q.correct.length} đáp án để kiểm tra. Đáp án được khóa sau khi kiểm tra.</p></div>`:''}<div class="exam-move"><button class="btn" data-exam="jump" data-index="${sequence[position-1]}" ${position===0?'disabled':''}>← Câu trước</button><button class="btn quiet small" data-exam="clear" ${revealed||!selected.length?'disabled':''}>Bỏ lựa chọn</button><button class="btn primary" data-exam="${position===64?(done?'result':'confirm'):'jump'}" data-index="${sequence[position+1]}">${position===64?(done?'Kết quả':'Nộp bài'):'Câu tiếp →'}</button></div>${revealed?`<details class="explanation" ${!done?'open':''}><summary>Giải thích gốc · ${right(q,selected)?'Trả lời đúng':selected.length?'Chưa đúng':'Bỏ trống'}</summary><div class="explanation-content">${content(q.explanation)}</div></details>`:`<p class="footnote">${untimed(a)?'Bấm Kiểm tra đáp án để xem đúng/sai và lời giải tại câu này.':'Có thể bỏ qua và quay lại. Đáp án chỉ hiện sau khi nộp bài.'}</p>`}</article></section><aside class="exam-navigator"><h3>Bản đồ câu hỏi</h3><div class="exam-filters">${[['all','Tất cả'],['flagged','Đánh dấu'],['empty','Chưa đủ'],...(done?[['wrong','Sai / bỏ trống']]:[])].map(([id,label])=>`<button class="btn small quiet" data-exam="filter" data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('')}</div><div class="exam-grid">${shown.map(i=>`<button class="exam-cell ${i===a.pos?'current':''} ${done?(right(bank.questions[i],a.answers[i])?'passed':'failed'):a.answers[i].length===bank.questions[i].correct.length?'answered':''} ${a.flags[i]?'flagged':''}" data-exam="jump" data-index="${i}" aria-label="Câu ${sequence.indexOf(i)+1}${a.flags[i]?', đánh dấu':''}" ${i===a.pos?'aria-current="step"':''}>${sequence.indexOf(i)+1}${a.flags[i]?'<sup>⚑</sup>':''}</button>`).join('')}</div>${shown.length?'':'<p class="muted">Không có câu trong nhóm này.</p>'}<p class="footnote">${done?'Xanh: đúng · Đỏ: sai / bỏ trống':'Xanh: đã chọn đủ · ⚑: xem lại'}<br>Viền sáng: câu hiện tại</p></aside></div></main>`;if(!done)clock();window.QuestFun?.applyPrefs();}
 function choose(n){if(window.DailyGate && !window.DailyGate.allow())return;const a=state.active;if(view!=='test'||!a||expire()||untimed(a)&&a.checked?.[a.pos])return;const q=bank.questions[a.pos];if(!a.order[a.pos].includes(n))return;const selected=a.answers[a.pos];if(selected.includes(n))selected.splice(selected.indexOf(n),1);else if(q.correct.length===1)a.answers[a.pos]=[n];else if(selected.length<q.correct.length)selected.push(n);if(a.checked)a.checked[a.pos]=false;save();renderQuestion();}
 function confirm(){if(!state.active||expire())return;if(hardcore(state.active)&&state.active.checked?.filter(Boolean).length!==65)return;const a=state.active,missing=a.answers.filter((s,i)=>s.length!==bank.questions[i].correct.length).length;modal.innerHTML=`<h2 id="exam-modal-title">Nộp bài kiểm tra?</h2><p>${missing?`Còn ${missing} câu chưa chọn đủ đáp án.`:'Bạn đã chọn đủ đáp án cho 65 câu.'} Có ${a.flags.filter(Boolean).length} câu được đánh dấu.</p><p>Sau khi nộp, bạn sẽ xem được điểm và lời giải nhưng không thể sửa bài này.</p><div class="modal-actions"><button class="btn quiet" data-exam="close">Quay lại kiểm tra</button><button class="btn primary" data-exam="submit">Nộp bài →</button></div>`;modal.showModal();}
 function submit(reason='manual'){const a=state.active;if(!a||bank?.id!==a.test)return;if(hardcore(a)&&a.checked?.filter(Boolean).length!==65)return;const timed=!untimed(a)&&Date.now()>=a.deadline;const h={...a,ended:timed?a.deadline:Date.now(),reason:timed?'timeout':reason,score:bank.questions.filter((q,i)=>right(q,a.answers[i])).length};state.history.push(h);state.active=null;save();window.DailyGate?.recordExam(bank,h);modal.close();review=h;result();}
 function result(){if(!review||!bank)return;view='result';const a=review;const sections=[...new Set(bank.questions.map(q=>q.section))];app.innerHTML=`<main class="exam-home">${header()}<section class="finish-card"><span class="eyebrow">${a.reason==='timeout'?'HẾT GIỜ · BÀI ĐÃ TỰ NỘP':'BÀI THI ĐÃ ĐƯỢC LƯU'}</span>${champion(a)?`<div class="hardcore-victory">${goldBadge()}<p>Bạn đã chinh phục ${ultra(a)?'Ultra Hardcore ☠️🔥':'Hardcore'}! Huy hiệu vàng đã được gắn lên đề này.</p></div>`:''}<h1>Đề ${a.test}: ${a.score}/65 đúng</h1><div class="exam-score">${Math.round(a.score/65*100)}<small>%</small></div><p>${untimed(a)?modeLabel(a):`Thi thử · ${Math.ceil((a.ended-a.started)/60000)} phút`} · ${a.answers.filter(s=>!s.length).length} câu bỏ trống</p><p>Đây là tỷ lệ đúng của bộ đề, không phải điểm chứng chỉ AWS.</p><div class="row wrap spaced"><button class="btn primary" data-exam="review">Xem lại bài & lời giải →</button><button class="btn quiet" data-exam="hub">Về phòng thi</button></div></section><h2>Kết quả theo nhóm kiến thức</h2>${sections.map(s=>{const indexes=bank.questions.map((q,i)=>q.section===s?i:-1).filter(i=>i>=0),n=indexes.filter(i=>right(bank.questions[i],a.answers[i])).length;return `<div class="list-row row between wrap"><h3>${esc(s)}</h3><span class="pill lime">${n}/${indexes.length} đúng</span></div>`;}).join('')}</main>`;window.scrollTo(0,0);}
 async function history(id){const h=state.history.find(h=>h.id===id);if(!h)return;await load(h.test);review=JSON.parse(JSON.stringify(h));result();}
 document.addEventListener('click',async e=>{const el=e.target.closest('[data-exam]');if(!el||el.disabled||busy)return;try{const action=el.dataset.exam;if(action==='close'){pendingUltra=null;modal.close();return;}if(state.active&&view==='test'&&expire())return;switch(action){case'prepare':prepare(Number(el.dataset.test));break;case'accept-ultra':{const n=Number(el.dataset.test);if(pendingUltra===n)await start(n,'ultra',true);break;}case'start':await start(Number(el.dataset.test),el.dataset.mode);break;case'resume':await resume(el.dataset.test?Number(el.dataset.test):undefined);break;case'answer':choose(Number(el.dataset.index));break;case'check':{const a=state.active;if(view!=='test'||!untimed(a)||(window.DailyGate&&!window.DailyGate.allow()))break;if(a.checked?.[a.pos]||a.answers[a.pos].length!==bank.questions[a.pos].correct.length)break;a.checked??=Array(65).fill(false);a.checked[a.pos]=true;const correct=right(bank.questions[a.pos],a.answers[a.pos]);if(correct)awardStage(a);if(!correct){a.everWrong??=Array(65).fill(false);a.everWrong[a.pos]=true;}save();window.DailyGate?.recordExamAnswer(bank.id,a.pos+1,correct);if(hardcore(a)&&!correct){restartHardcore('Sai một câu',a.pos);break;}delete a.restartNotice;renderQuestion();if(correct)window.QuestFun?.playSound('right');break;}case'jump':{const a=view==='review'?review:state.active,n=Number(el.dataset.index);if(a&&n>=0&&n<65){if(view==='test'&&hardcore(a)&&!a.checked?.[n]){const next=a.questionOrder.find(i=>!a.checked?.[i]);if(n!==next)break;}a.pos=n;if(view==='test')save();renderQuestion();scrollToQuestion();}break;}case'flag':if(state.active&&view==='test'){state.active.flags[state.active.pos]=!state.active.flags[state.active.pos];save();renderQuestion();}break;case'clear':if(state.active&&view==='test'&&!(untimed(state.active)&&state.active.checked?.[state.active.pos])){state.active.answers[state.active.pos]=[];if(state.active.checked)state.active.checked[state.active.pos]=false;save();renderQuestion();}break;case'filter':filter=el.dataset.filter;renderQuestion();break;case'confirm':confirm();break;case'submit':submit();break;case'history':await history(el.dataset.id);break;case'review':view='review';filter='all';review.pos=0;renderQuestion();break;case'result':result();break;case'hub':hub();break;}}catch(err){hub();warning(err.message||'Không mở được bài thi. Vui lòng thử lại.');}});
 window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const s=JSON.parse(e.newValue);if(validState(s)){state=s;modal.close();hub();if(state.active)resume().catch(e=>warning(e.message));}}catch{}});
 document.addEventListener('click',e=>{if(ultra(state.active)&&e.target.closest('a')&&!e.target.closest('#quest-music,#question-note-dialog,.explanation')){e.preventDefault();e.stopImmediatePropagation();}},true);
 window.addEventListener('beforeunload',e=>{if(ultra(state.active)){save();e.preventDefault();e.returnValue='';}});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)clock();});
 setInterval(clock,1000);hub();if(state.active)resume().catch(e=>{hub();warning(e.message);});
 if(qa)window.Exam={get state(){return state;},get bank(){return bank;},start,choose,submit,resume,history,clock,reset(){state={version:1,active:null,history:[]};save();modal.close();hub();}};
})();

});</script></body></html>
