oom .answer-copy img{max-width:100%;height:auto}.exam-room .explanation-content{overflow:auto}.exam-room .explanation-content img{max-width:100%;height:auto}.exam-room table{max-width:100%;font-size:12px}.exam-room pre{white-space:pre-wrap}

<body><div id="storage-warning" hidden></div><div id="exam-app"></div><dialog id="exam-modal" aria-labelledby="exam-modal-title"></dialog><script>'use strict';
(() => {
 const qa=new URLSearchParams(location.search).has('qa'),KEY=qa?'aws-realtest-qa-v1':'aws-realtest-v1';
 const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let state={version:1,active:null,history:[]},bank=null,view='hub',review=null,filter='all',busy=false;
 const modal=$('exam-modal'),app=$('exam-app');
 function warning(message){$('storage-warning').hidden=false;$('storage-warning').textContent=message;}
 function validRun(a){return a&&Number.isInteger(a.test)&&a.test>=1&&a.test<=4&&typeof a.id==='string'&&Number.isFinite(a.started)&&Number.isFinite(a.deadline)&&a.deadline===a.started+7200000&&Number.isInteger(a.pos)&&a.pos>=0&&a.pos<65&&Array.isArray(a.answers)&&a.answers.length===65&&a.answers.every(x=>Array.isArray(x)&&new Set(x).size===x.length&&x.every(n=>Number.isInteger(n)&&n>=0&&n<10))&&Array.isArray(a.flags)&&a.flags.length===65&&a.flags.every(x=>typeof x==='boolean')&&Array.isArray(a.order)&&a.order.length===65&&a.order.every(x=>Array.isArray(x)&&x.length>=2&&new Set(x).size===x.length&&x.every(n=>Number.isInteger(n)&&n>=0&&n<x.length));}
 function validState(s){return s&&s.version===1&&(!s.active||validRun(s.active))&&Array.isArray(s.history)&&s.history.every(a=>validRun(a)&&Number.isFinite(a.ended)&&Number.isInteger(a.score)&&a.score>=0&&a.score<=65);}
 try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(!validState(s))throw Error();state=s;}}catch{warning('Không đọc được dữ liệu thi đã lưu. Hãy kiểm tra quyền lưu trữ của trình duyệt.');}
 function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{warning('Không lưu được bài thi trên trình duyệt. Giữ trang mở để tiếp tục; dữ liệu có thể mất khi đóng trang.');}}
 const shuffled=n=>{const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
 const right=(q,selected)=>selected.length===q.correct.length&&selected.every(n=>q.correct.includes(n));
 function clean(html){const d=new DOMParser().parseFromString(html,'text/html');const allowed=new Set('P BR B STRONG I EM U UL OL LI PRE CODE DIV SPAN A IMG TABLE THEAD TBODY TR TD TH H2 H3 H4 BLOCKQUOTE HR'.split(' '));for(const el of [...d.body.querySelectorAll('*')]){if(!allowed.has(el.tagName)){el.remove();continue;}for(const a of [...el.attributes])if(!['src','href','alt','colspan','rowspan'].includes(a.name))el.removeAttribute(a.name);if(el.tagName==='A'){if(!/^https?:\/\//i.test(el.getAttribute('href')||''))el.removeAttribute('href');el.target='_blank';el.rel='noopener noreferrer';}if(el.tagName==='IMG'){if(!/^exams\/assets\/[a-f0-9]+\.(png|jpg|gif|webp)$/.test(el.getAttribute('src')||''))el.removeAttribute('src');el.loading='lazy';}}return d.body.innerHTML;}
 const cache=new Map();function content(html){if(!cache.has(html))cache.set(html,clean(html));return cache.get(html);}
 async function load(test){if(bank?.id===test)return;busy=true;app.innerHTML='<main class="exam-home"><p role="status">Đang mở đề kiểm tra…</p></main>';try{await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='exams/test'+test+'.js';script.onload=()=>{script.remove();resolve();};script.onerror=()=>{script.remove();reject(Error('Không tải được đề. Kiểm tra kết nối rồi thử lại.'));};document.head.append(script);});bank=window.REALTEST_DATA;if(bank?.id!==test||bank.questions.length!==65)throw Error('Dữ liệu đề không hợp lệ.');}finally{busy=false;}}
 const header=()=>`<header class="exam-top"><a class="brand" href="${qa?'index.html?qa=1':'index.html'}"><span class="brand-mark">⌘</span><div>Data Quest<small>PHÒNG THI THỬ</small></div></a><span class="pill lime">4 ĐỀ RIÊNG · 260 CÂU</span></header>`;
 function hub(){view='hub';review=null;app.innerHTML=`<main class="exam-home">${header()}<section class="exam-hero"><span class="eyebrow">🎯 ĐẾN LÚC TỰ KIỂM CHỨNG</span><h1>Kiến thức của bạn<br>đã sẵn sàng chưa?</h1><p>65 câu · 120 phút mỗi đề · Chấm điểm khi nộp bài.<br>Được bỏ qua, đổi lựa chọn và đánh dấu câu để quay lại.</p><p class="muted">Đây là bộ đề kiểm tra riêng, không cộng vào tiến độ luyện tập. Đồng hồ tiếp tục chạy khi bạn rời trang.</p></section>${state.active?`<div class="callout row between wrap"><div><strong>Đề ${state.active.test} đang làm dở</strong><p>${state.active.answers.filter(a=>a.length).length}/65 câu đã chọn · Thời gian còn lại tính từ lúc bắt đầu</p></div><button class="btn primary" data-exam="resume">Tiếp tục bài thi →</button></div>`:''}<div class="exam-cards">${[1,2,3,4].map(n=>{const runs=state.history.filter(h=>h.test===n);return `<article class="session-card"><span class="session-icon">${['🧭','🛰️','🧪','🏁'][n-1]}</span><h2>Đề kiểm tra ${n}</h2><p>65 câu · 120 phút<br>Đảo thứ tự đáp án · Không gợi ý trong bài</p><small>${runs.length?`${runs.length} lượt thi · Cao nhất ${Math.max(...runs.map(h=>h.score))}/65`:'Chưa có lượt thi'}</small><button class="btn primary spaced" data-exam="prepare" data-test="${n}" ${state.active?'disabled':''}>Vào phòng thi →</button></article>`;}).join('')}</div><section class="spaced"><div class="row between wrap"><h2>Lịch sử kiểm tra</h2><small>Tự lưu trên trình duyệt này</small></div>${state.history.length?state.history.slice().reverse().map(h=>`<article class="list-row row between wrap"><div><h3>Đề ${h.test} · ${h.score}/65 đúng (${Math.round(h.score/65*100)}%)</h3><p>${new Date(h.ended).toLocaleString('vi-VN')} · ${h.reason==='timeout'?'Hết giờ · Tự nộp':'Đã nộp bài'} · ${Math.ceil((h.ended-h.started)/60000)} phút</p></div><button class="btn" data-exam="history" data-id="${esc(h.id)}">Xem kết quả →</button></article>`).join(''):'<div class="empty"><h3>Lượt kiểm tra đầu tiên đang chờ.</h3><p>Kết quả và câu trả lời sẽ được lưu tại đây.</p></div>'}</section><p class="footnote">Điểm là tỷ lệ đúng trên bộ đề, không quy đổi sang điểm chứng chỉ AWS. Lời giải gốc chỉ mở sau khi nộp bài.</p><a class="btn quiet spaced" href="${qa?'index.html?qa=1':'index.html'}">← Về khu luyện tập</a></main>`;}
 function prepare(n){if(state.active)return;modal.innerHTML=`<span class="eyebrow">SẴN SÀNG CHO 120 PHÚT?</span><h2 id="exam-modal-title">Đề kiểm tra ${n}</h2><p>65 câu, chọn đủ đáp án yêu cầu. Câu nhiều lựa chọn chỉ được tính đúng khi khớp toàn bộ.</p><p>Không hiện đúng/sai trong lúc làm. Bạn được quay lại sửa câu trả lời trước khi nộp. Hết 120 phút, bài tự nộp; đóng trang không dừng đồng hồ.</p><div class="modal-actions"><button class="btn quiet" data-exam="close">Để sau</button><button class="btn primary" data-exam="start" data-test="${n}">Bắt đầu tính giờ →</button></div>`;modal.showModal();}
 async function start(n){if(state.active)return;modal.close();await load(n);const now=Date.now();state.active={id:String(now)+'-'+Math.random().toString(36).slice(2),test:n,started:now,deadline:now+7200000,pos:0,answers:bank.questions.map(()=>[]),flags:bank.questions.map(()=>false),order:bank.questions.map(q=>shuffled(q.answers.length))};save();view='test';filter='all';renderQuestion();}
 async function resume(){if(!state.active)return;await load(state.active.test);view='test';filter='all';if(!expire())renderQuestion();}
 function expire(){if(state.active&&Date.now()>=state.active.deadline&&bank?.id===state.active.test){submit('timeout');return true;}return false;}
 function clock(){const a=state.active;if(!a)return;if(expire())return;const el=$('exam-clock');if(el){const s=Math.max(0,Math.ceil((a.deadline-Date.now())/1000));el.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');el.classList.toggle('urgent',s<600);}}
 function renderQuestion(){const a=view==='review'?review:state.active;if(!a||!bank)return;const done=view==='review',q=bank.questions[a.pos],selected=a.answers[a.pos],complete=a.answers.filter((s,i)=>s.length===bank.questions[i].correct.length).length;const shown=bank.questions.map((q,i)=>i).filter(i=>filter==='all'||filter==='flagged'&&a.flags[i]||filter==='empty'&&a.answers[i].length!==bank.questions[i].correct.length||filter==='wrong'&&!right(bank.questions[i],a.answers[i]));
 app.innerHTML=`<main class="exam-room"><header class="exam-top">${done?`<button class="btn quiet" data-exam="result">← Kết quả</button>`:`<a class="brand" href="index.html"><span class="brand-mark">⌘</span><div>Data Quest<small>ĐỀ KIỂM TRA ${a.test}</small></div></a>`}<div class="row wrap">${done?'<span class="pill lime">ĐÃ NỘP · XEM LẠI</span>':'<span class="exam-clock" id="exam-clock" role="timer" aria-label="Thời gian còn lại"></span><button class="btn primary" data-exam="confirm">Nộp bài</button>'}</div></header><div class="exam-layout"><section><div class="row between wrap spaced"><span class="eyebrow">ĐỀ ${a.test} · CÂU ${a.pos+1}/65</span><small>${complete}/65 câu đã chọn đủ</small></div><article class="question-card spaced"><div class="row between wrap"><span class="pill">Chọn ${q.correct.length} đáp án</span><button class="btn small quiet" data-exam="flag" ${done?'disabled':''}>${a.flags[a.pos]?'⚑ Đã đánh dấu':'⚐ Đánh dấu xem lại'}</button></div><div class="question-text">${content(q.question)}</div><div class="answer-list">${a.order[a.pos].map((n,i)=>`<button class="answer ${done?(q.correct.includes(n)?'correct':selected.includes(n)?'wrong':''):selected.includes(n)?'selected':''}" data-exam="answer" data-index="${n}" aria-pressed="${selected.includes(n)}" ${done?'disabled':''}><span class="answer-letter">${String.fromCharCode(65+i)}</span><span class="answer-copy">${content(q.answers[n])}${done?`<span class="answer-status">${q.correct.includes(n)?'✓ Đáp án đúng':''}${selected.includes(n)?' · Bạn đã chọn':''}</span>`:''}</span></button>`).join('')}</div><div class="exam-move"><button class="btn" data-exam="jump" data-index="${a.pos-1}" ${a.pos===0?'disabled':''}>← Câu trước</button><button class="btn quiet small" data-exam="clear" ${done||!selected.length?'disabled':''}>Bỏ lựa chọn</button><button class="btn primary" data-exam="${a.pos===64?(done?'result':'confirm'):'jump'}" data-index="${a.pos+1}">${a.pos===64?(done?'Kết quả':'Nộp bài'):'Câu tiếp →'}</button></div>${done?`<details class="explanation"><summary>Giải thích gốc · ${right(q,selected)?'Trả lời đúng':selected.length?'Chưa đúng':'Bỏ trống'}</summary><div class="explanation-content">${content(q.explanation)}</div></details>`:'<p class="footnote">Có thể bỏ qua và quay lại. Đáp án chỉ hiện sau khi nộp bài.</p>'}</article></section><aside class="exam-navigator"><h3>Bản đồ câu hỏi</h3><div class="exam-filters">${[['all','Tất cả'],['flagged','Đánh dấu'],['empty','Chưa đủ'],...(done?[['wrong','Sai / bỏ trống']]:[])].map(([id,label])=>`<button class="btn small quiet" data-exam="filter" data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('')}</div><div class="exam-grid">${shown.map(i=>`<button class="exam-cell ${i===a.pos?'current':''} ${done?(right(bank.questions[i],a.answers[i])?'passed':'failed'):a.answers[i].length===bank.questions[i].correct.length?'answered':''} ${a.flags[i]?'flagged':''}" data-exam="jump" data-index="${i}" aria-label="Câu ${i+1}${a.flags[i]?', đánh dấu':''}" ${i===a.pos?'aria-current="step"':''}>${i+1}${a.flags[i]?'<sup>⚑</sup>':''}</button>`).join('')}</div>${shown.length?'':'<p class="muted">Không có câu trong nhóm này.</p>'}<p class="footnote">${done?'Xanh: đúng · Đỏ: sai / bỏ trống':'Xanh: đã chọn đủ · ⚑: xem lại'}<br>Viền sáng: câu hiện tại</p></aside></div></main>`;if(!done)clock();}
 function choose(n){const a=state.active;if(view!=='test'||!a||expire())return;const q=bank.questions[a.pos];if(!a.order[a.pos].includes(n))return;const selected=a.answers[a.pos];if(selected.includes(n))selected.splice(selected.indexOf(n),1);else if(q.correct.length===1)a.answers[a.pos]=[n];else if(selected.length<q.correct.length)selected.push(n);save();renderQuestion();}
 function confirm(){if(!state.active||expire())return;const a=state.active,missing=a.answers.filter((s,i)=>s.length!==bank.questions[i].correct.length).length;modal.innerHTML=`<h2 id="exam-modal-title">Nộp bài kiểm tra?</h2><p>${missing?`Còn ${missing} câu chưa chọn đủ đáp án.`:'Bạn đã chọn đủ đáp án cho 65 câu.'} Có ${a.flags.filter(Boolean).length} câu được đánh dấu.</p><p>Sau khi nộp, bạn sẽ xem được điểm và lời giải nhưng không thể sửa bài này.</p><div class="modal-actions"><button class="btn quiet" data-exam="close">Quay lại kiểm tra</button><button class="btn primary" data-exam="submit">Nộp bài →</button></div>`;modal.showModal();}
 function submit(reason='manual'){const a=state.active;if(!a||bank?.id!==a.test)return;const timed=Date.now()>=a.deadline;const h={...a,ended:timed?a.deadline:Date.now(),reason:timed?'timeout':reason,score:bank.questions.filter((q,i)=>right(q,a.answers[i])).length};state.history.push(h);state.active=null;save();modal.close();review=h;result();}
 function result(){if(!review||!bank)return;view='result';const a=review;const sections=[...new Set(bank.questions.map(q=>q.section))];app.innerHTML=`<main class="exam-home">${header()}<section class="finish-card"><span class="eyebrow">${a.reason==='timeout'?'HẾT GIỜ · BÀI ĐÃ TỰ NỘP':'BÀI THI ĐÃ ĐƯỢC LƯU'}</span><h1>Đề ${a.test}: ${a.score}/65 đúng</h1><div class="exam-score">${Math.round(a.score/65*100)}<small>%</small></div><p>${Math.ceil((a.ended-a.started)/60000)} phút · ${a.answers.filter(s=>!s.length).length} câu bỏ trống</p><p>Đây là tỷ lệ đúng của bộ đề, không phải điểm chứng chỉ AWS.</p><div class="row wrap spaced"><button class="btn primary" data-exam="review">Xem lại bài & lời giải →</button><button class="btn quiet" data-exam="hub">Về phòng thi</button></div></section><h2>Kết quả theo nhóm kiến thức</h2>${sections.map(s=>{const indexes=bank.questions.map((q,i)=>q.section===s?i:-1).filter(i=>i>=0),n=indexes.filter(i=>right(bank.questions[i],a.answers[i])).length;return `<div class="list-row row between wrap"><h3>${esc(s)}</h3><span class="pill lime">${n}/${indexes.length} đúng</span></div>`;}).join('')}</main>`;window.scrollTo(0,0);}
 async function history(id){const h=state.history.find(h=>h.id===id);if(!h)return;await load(h.test);review=JSON.parse(JSON.stringify(h));result();}
 document.addEventListener('click',async e=>{const el=e.target.closest('[data-exam]');if(!el||el.disabled||busy)return;try{const action=el.dataset.exam;if(action==='close'){modal.close();return;}if(state.active&&view==='test'&&expire())return;switch(action){case'prepare':prepare(Number(el.dataset.test));break;case'start':await start(Number(el.dataset.test));break;case'resume':await resume();break;case'answer':choose(Number(el.dataset.index));break;case'jump':{const a=view==='review'?review:state.active,n=Number(el.dataset.index);if(a&&n>=0&&n<65){a.pos=n;if(view==='test')save();renderQuestion();window.scrollTo(0,0);}break;}case'flag':if(state.active&&view==='test'){state.active.flags[state.active.pos]=!state.active.flags[state.active.pos];save();renderQuestion();}break;case'clear':if(state.active&&view==='test'){state.active.answers[state.active.pos]=[];save();renderQuestion();}break;case'filter':filter=el.dataset.filter;renderQuestion();break;case'confirm':confirm();break;case'submit':submit();break;case'history':await history(el.dataset.id);break;case'review':view='review';filter='all';review.pos=0;renderQuestion();break;case'result':result();break;case'hub':hub();break;}}catch(err){hub();warning(err.message||'Không mở được bài thi. Vui lòng thử lại.');}});
 window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const s=JSON.parse(e.newValue);if(validState(s)){state=s;modal.close();hub();if(state.active)resume().catch(e=>warning(e.message));}}catch{}});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)clock();});
 setInterval(clock,1000);hub();if(state.active)resume().catch(e=>{hub();warning(e.message);});
 if(qa)window.Exam={get state(){return state;},get bank(){return bank;},start,choose,submit,resume,history,clock,reset(){state={version:1,active:null,history:[]};save();modal.close();hub();}};
})();
</script></body></html>
