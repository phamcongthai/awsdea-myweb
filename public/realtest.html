<body><div id="storage-warning" hidden></div><div id="exam-app"></div><dialog id="exam-modal" aria-labelledby="exam-modal-title"></dialog><script>'use strict';
(() => {
  // Recordings and credits are bundled with the site; keep audio outside #app.
  const tracks=[
    ['fur-elise','Für Elise','Beethoven','V Gao (Gaodifan)','FurElise.ogg','CC0 / Public domain','https://creativecommons.org/publicdomain/zero/1.0/'],
    ['moonlight','Moonlight Sonata · Chương I','Beethoven','Juan Felipe Arjona','Moonlight.ogg','CC BY 2.5','https://creativecommons.org/licenses/by/2.5/'],
    ['clair-de-lune','Clair de lune','Debussy','Laurens Goedhart','Clair de lune (Claude Debussy) Suite bergamasque.ogg','CC BY 3.0','https://creativecommons.org/licenses/by/3.0/'],
    ['nocturne','Nocturne Op. 9 No. 2','Chopin','Martha Goldstein','Frederic Chopin - Nocturne Eb major Opus 9, number 2.ogg','CC BY-SA 2.0','https://creativecommons.org/licenses/by-sa/2.0/'],
    ['canon','Canon in D · Piano','Pachelbel','Lee Galloway',"Pachelbel's Canon.ogg",'CC BY-SA 3.0','https://creativecommons.org/licenses/by-sa/3.0/'],
    ["swan-lake","Swan Lake · Hồ thiên nga · Kết màn II","Tchaikovsky","European Archive / Musopen","Tchaikovsky - Swan Lake Op.20 - Act II Concl.ogg","Public domain","https://creativecommons.org/publicdomain/mark/1.0/"],
    ["pathetique","Pathétique Sonata · Chương II","Beethoven","Jmfayard","Beethoven - Pathétique - 2e mouvement adagio cantabile.ogg","CC BY-SA 3.0","https://creativecommons.org/licenses/by-sa/3.0/"],
    ["symphony-5","Symphony No. 5 · Định mệnh · Chương I","Beethoven","Skidmore College Orchestra / Musopen","Ludwig van Beethoven - symphony no. 5 in c minor, op. 67 - i. allegro con brio.ogg","Public domain / Attribution","https://commons.wikimedia.org/wiki/File:Ludwig%20van%20Beethoven%20-%20symphony%20no.%205%20in%20c%20minor%2C%20op.%2067%20-%20i.%20allegro%20con%20brio.ogg"],
    ["nachtmusik","Eine kleine Nachtmusik · Chương I","Mozart","Advent Chamber Orchestra · Roxanna Pavel Goldstein / Al Goldstein, Pandora (ibiblio)","Mozart - Eine kleine Nachtmusik - 1. Allegro.ogg","CC BY-SA 2.0","https://creativecommons.org/licenses/by-sa/2.0/"],
    ["turkish-march","Turkish March · Rondo alla turca","Mozart","Romuald Greiss","Mozart-Marsz turecki-(Romuald Greiss).ogg","Public domain","https://creativecommons.org/publicdomain/mark/1.0/"],
    ["sonata-16","Piano Sonata No. 16, K. 545 · Chương I","Mozart","Musopen (https://musopen.org/)","Wolfgang Amadeus Mozart - sonata no. 16 in c major, k.545 'sonata facile' - i. allegro.ogg","Public domain / Attribution","https://commons.wikimedia.org/wiki/File:Wolfgang%20Amadeus%20Mozart%20-%20sonata%20no.%2016%20in%20c%20major%2C%20k.545%20'sonata%20facile'%20-%20i.%20allegro.ogg"]
  ];
  const qa=new URLSearchParams(location.search).has('qa'),key=qa?'data-quest-music-test':'data-quest-music';
  let volume=.65,enabled=true,index=0,blocked=false,failed=false,request=0;
  try{const s=JSON.parse(localStorage.getItem(key));if(Number.isFinite(s?.volume))volume=Math.max(0,Math.min(1,s.volume));if(s?.version===3&&Number.isInteger(s.index)&&tracks[s.index])index=s.index;}catch(_){}
  const dock=document.createElement('aside');dock.id='quest-music';dock.setAttribute('aria-label','Nhạc cổ điển');
  dock.innerHTML=`<div class="music-buttons"><button type="button" class="music-power" aria-pressed="true">🔇 Tắt nhạc</button><button type="button" class="music-toggle" aria-expanded="false" aria-controls="music-panel">♫ Nhạc cổ điển</button></div>
  <section id="music-panel" hidden aria-label="Danh sách nhạc cổ điển"><strong>🎹 Góc nhạc cổ điển</strong><p class="music-current"></p><div class="music-transport"><button type="button" data-music="prev" aria-label="Bài trước">⏮</button><span>${tracks.length} bản · Lặp danh sách</span><button type="button" data-music="next" aria-label="Bài tiếp theo">⏭</button></div><label for="music-track">Chọn bản nhạc</label><select id="music-track">${tracks.map((t,i)=>`<option value="${i}">${i+1}. ${t[1]} — ${t[2]}</option>`).join('')}</select><label>Âm lượng <input class="music-volume" type="range" min="0" max="100" value="${Math.round(volume*100)}"><output>${Math.round(volume*100)}%</output></label><p class="music-status" role="status"></p><p class="music-hint">Tự chuyển bài khi nghe hết. Chuyển câu và thu gọn vẫn tiếp tục phát.</p><details><summary>Nghệ sĩ & nguồn bản thu</summary><p class="music-credit"></p><small>Bản MP3 từ Wikimedia Commons; giữ nguyên bản thu, không cắt ghép.</small></details></section>`;
  document.body.append(dock);
  const audio=document.createElement('audio');audio.preload='metadata';audio.volume=volume;dock.append(audio);
  const power=dock.querySelector('.music-power'),toggle=dock.querySelector('.music-toggle'),panel=dock.querySelector('#music-panel'),status=dock.querySelector('.music-status'),select=dock.querySelector('select');
  function save(){try{localStorage.setItem(key,JSON.stringify({version:3,volume,index}));}catch(_){} }
  function show(){power.textContent=enabled?'🔇 Tắt nhạc':'▶ Bật nhạc';power.setAttribute('aria-pressed',String(enabled));status.textContent=!enabled?'Đã tắt nhạc.':failed?'Không tải được bản nhạc. Nhấn bài tiếp theo hoặc tắt rồi bật để thử lại.':blocked?'Chạm vào trang để bắt đầu nghe.':audio.paused?'Đang tải bản nhạc…':'Đang phát · '+tracks[index][1];}
  async function play(){
    if(!enabled||failed)return;const token=++request;
    try{await audio.play();if(token!==request)return;blocked=false;if(!enabled)audio.pause();show();}
    catch(e){if(token!==request)return;if(e.name==='NotAllowedError')blocked=true;else if(e.name!=='AbortError')failed=true;show();}
  }
  function choose(n){
    request++;audio.pause();index=(n+tracks.length)%tracks.length;failed=false;blocked=false;
    const t=tracks[index];select.value=String(index);dock.querySelector('.music-current').textContent=t[1]+' — '+t[2];
    const credit=dock.querySelector('.music-credit');credit.replaceChildren(document.createTextNode('Biểu diễn: '+t[3]+'. '));
    for(const [text,href] of [['Nguồn bản thu','https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(t[4])],[t[5],t[6]]]){const a=document.createElement('a');a.textContent=text;a.href=href;a.target='_blank';a.rel='noopener noreferrer';credit.append(a,document.createTextNode(' · '));}
    const localRoot=location.protocol==='file:'&&!/\/public\//i.test(location.pathname)?'public/':'';
    audio.src=localRoot+'music/'+t[0]+'.mp3';save();show();if(enabled)play();
  }
  power.addEventListener('click',()=>{enabled=!enabled;request++;if(enabled){if(failed){failed=false;audio.load();}play();}else audio.pause();show();});
  toggle.addEventListener('click',()=>{panel.hidden=!panel.hidden;toggle.setAttribute('aria-expanded',String(!panel.hidden));});
  dock.querySelector('[data-music=prev]').addEventListener('click',()=>choose(index-1));dock.querySelector('[data-music=next]').addEventListener('click',()=>choose(index+1));select.addEventListener('change',()=>choose(Number(select.value)));
  dock.addEventListener('keydown',e=>{if(e.key==='Escape'){panel.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.focus();}});
  dock.querySelector('.music-volume').addEventListener('input',e=>{volume=Number(e.target.value)/100;audio.volume=volume;dock.querySelector('output').textContent=e.target.value+'%';save();});
  audio.addEventListener('ended',()=>{if(enabled)choose(index+1);});audio.addEventListener('playing',()=>{if(!enabled)audio.pause();else{blocked=false;show();}});audio.addEventListener('pause',show);
  audio.addEventListener('error',()=>{failed=true;show();});
  function gesture(e){if(e.target.closest?.('.music-power, [data-music], #music-track'))return;if(enabled&&audio.paused&&!failed)play();}
  document.addEventListener('pointerdown',gesture);document.addEventListener('keydown',gesture);
  window.addEventListener('pagehide',()=>{request++;audio.pause();});window.addEventListener('pageshow',()=>{if(enabled)play();});
  if(qa)window.QuestMusic={get state(){return {enabled,volume,index,paused:audio.paused,blocked,failed,count:tracks.length};}};
  choose(index);

 function renderQuestion(){const a=view==='review'?review:state.active;if(!a||!bank)return;const done=view==='review',revealed=done||untimed(a)&&!!a.checked?.[a.pos],q=bank.questions[a.pos],selected=a.answers[a.pos],complete=a.answers.filter((s,i)=>s.length===bank.questions[i].correct.length).length;const shown=bank.questions.map((q,i)=>i).filter(i=>filter==='all'||filter==='flagged'&&a.flags[i]||filter==='empty'&&a.answers[i].length!==bank.questions[i].correct.length||filter==='wrong'&&!right(bank.questions[i],a.answers[i]));
 app.innerHTML=`<main class="exam-room"><header class="exam-top">${done?`<button class="btn quiet" data-exam="result">← Kết quả</button>`:`<a class="brand" href="index.html"><span class="brand-mark">⌘</span><div>Data Quest<small>ĐỀ KIỂM TRA ${a.test}</small></div></a>`}<div class="row wrap">${done?'<span class="pill lime">ĐÃ NỘP · XEM LẠI</span>':`${untimed(a)?'<span class="pill lime">Review · Không tính giờ</span>':'<span class="exam-clock" id="exam-clock" role="timer" aria-label="Thời gian còn lại"></span>'}<button class="btn quiet" data-exam="hub">Lưu & thoát</button><button class="btn primary" data-exam="confirm">Nộp bài</button>`}</div></header><div class="exam-layout"><section><div class="row between wrap spaced"><span class="eyebrow">ĐỀ ${a.test} · CÂU ${a.pos+1}/65</span><small>${complete}/65 câu đã chọn đủ</small></div><article class="question-card spaced"><div class="row between wrap"><span class="pill">Chọn ${q.correct.length} đáp án</span><button class="btn small quiet" data-exam="flag" ${done?'disabled':''}>${a.flags[a.pos]?'⚑ Đã đánh dấu':'⚐ Đánh dấu xem lại'}</button></div><div class="question-text">${content(q.question)}</div><div class="answer-list">${a.order[a.pos].map((n,i)=>`<button class="answer ${revealed?(q.correct.includes(n)?'correct':selected.includes(n)?'wrong':''):selected.includes(n)?'selected':''}" data-exam="answer" data-index="${n}" aria-pressed="${selected.includes(n)}" ${done?'disabled':''}><span class="answer-letter">${String.fromCharCode(65+i)}</span><span class="answer-copy">${content(q.answers[n])}${revealed?`<span class="answer-status">${q.correct.includes(n)?'✓ Đáp án đúng':''}${selected.includes(n)?' · Bạn đã chọn':''}</span>`:''}</span></button>`).join('')}</div>${!done&&untimed(a)?`<div class="spaced"><button class="btn primary" data-exam="check" ${selected.length!==q.correct.length?'disabled':''}>✓ Kiểm tra đáp án</button><p class="footnote">Chọn đủ ${q.correct.length} đáp án để kiểm tra. Đổi lựa chọn sẽ ẩn lời giải để bạn kiểm tra lại.</p></div>`:''}<div class="exam-move"><button class="btn" data-exam="jump" data-index="${a.pos-1}" ${a.pos===0?'disabled':''}>← Câu trước</button><button class="btn quiet small" data-exam="clear" ${done||!selected.length?'disabled':''}>Bỏ lựa chọn</button><button class="btn primary" data-exam="${a.pos===64?(done?'result':'confirm'):'jump'}" data-index="${a.pos+1}">${a.pos===64?(done?'Kết quả':'Nộp bài'):'Câu tiếp →'}</button></div>${revealed?`<details class="explanation" ${!done?'open':''}><summary>Giải thích gốc · ${right(q,selected)?'Trả lời đúng':selected.length?'Chưa đúng':'Bỏ trống'}</summary><div class="explanation-content">${content(q.explanation)}</div></details>`:`<p class="footnote">${untimed(a)?'Bấm Kiểm tra đáp án để xem đúng/sai và lời giải tại câu này.':'Có thể bỏ qua và quay lại. Đáp án chỉ hiện sau khi nộp bài.'}</p>`}</article></section><aside class="exam-navigator"><h3>Bản đồ câu hỏi</h3><div class="exam-filters">${[['all','Tất cả'],['flagged','Đánh dấu'],['empty','Chưa đủ'],...(done?[['wrong','Sai / bỏ trống']]:[])].map(([id,label])=>`<button class="btn small quiet" data-exam="filter" data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('')}</div><div class="exam-grid">${shown.map(i=>`<button class="exam-cell ${i===a.pos?'current':''} ${done?(right(bank.questions[i],a.answers[i])?'passed':'failed'):a.answers[i].length===bank.questions[i].correct.length?'answered':''} ${a.flags[i]?'flagged':''}" data-exam="jump" data-index="${i}" aria-label="Câu ${i+1}${a.flags[i]?', đánh dấu':''}" ${i===a.pos?'aria-current="step"':''}>${i+1}${a.flags[i]?'<sup>⚑</sup>':''}</button>`).join('')}</div>${shown.length?'':'<p class="muted">Không có câu trong nhóm này.</p>'}<p class="footnote">${done?'Xanh: đúng · Đỏ: sai / bỏ trống':'Xanh: đã chọn đủ · ⚑: xem lại'}<br>Viền sáng: câu hiện tại</p></aside></div></main>`;if(!done)clock();}
 function choose(n){if(window.DailyGate && !window.DailyGate.allow())return;const a=state.active;if(view!=='test'||!a||expire())return;const q=bank.questions[a.pos];if(!a.order[a.pos].includes(n))return;const selected=a.answers[a.pos];if(selected.includes(n))selected.splice(selected.indexOf(n),1);else if(q.correct.length===1)a.answers[a.pos]=[n];else if(selected.length<q.correct.length)selected.push(n);if(a.checked)a.checked[a.pos]=false;save();renderQuestion();}
 function confirm(){if(!state.active||expire())return;const a=state.active,missing=a.answers.filter((s,i)=>s.length!==bank.questions[i].correct.length).length;modal.innerHTML=`<h2 id="exam-modal-title">Nộp bài kiểm tra?</h2><p>${missing?`Còn ${missing} câu chưa chọn đủ đáp án.`:'Bạn đã chọn đủ đáp án cho 65 câu.'} Có ${a.flags.filter(Boolean).length} câu được đánh dấu.</p><p>Sau khi nộp, bạn sẽ xem được điểm và lời giải nhưng không thể sửa bài này.</p><div class="modal-actions"><button class="btn quiet" data-exam="close">Quay lại kiểm tra</button><button class="btn primary" data-exam="submit">Nộp bài →</button></div>`;modal.showModal();}
 function submit(reason='manual'){const a=state.active;if(!a||bank?.id!==a.test)return;const timed=!untimed(a)&&Date.now()>=a.deadline;const h={...a,ended:timed?a.deadline:Date.now(),reason:timed?'timeout':reason,score:bank.questions.filter((q,i)=>right(q,a.answers[i])).length};state.history.push(h);state.active=null;save();window.DailyGate?.recordExam(bank,h);modal.close();review=h;result();}
 function result(){if(!review||!bank)return;view='result';const a=review;const sections=[...new Set(bank.questions.map(q=>q.section))];app.innerHTML=`<main class="exam-home">${header()}<section class="finish-card"><span class="eyebrow">${a.reason==='timeout'?'HẾT GIỜ · BÀI ĐÃ TỰ NỘP':'BÀI THI ĐÃ ĐƯỢC LƯU'}</span><h1>Đề ${a.test}: ${a.score}/65 đúng</h1><div class="exam-score">${Math.round(a.score/65*100)}<small>%</small></div><p>${untimed(a)?modeLabel(a):`Thi thử · ${Math.ceil((a.ended-a.started)/60000)} phút`} · ${a.answers.filter(s=>!s.length).length} câu bỏ trống</p><p>Đây là tỷ lệ đúng của bộ đề, không phải điểm chứng chỉ AWS.</p><div class="row wrap spaced"><button class="btn primary" data-exam="review">Xem lại bài & lời giải →</button><button class="btn quiet" data-exam="hub">Về phòng thi</button></div></section><h2>Kết quả theo nhóm kiến thức</h2>${sections.map(s=>{const indexes=bank.questions.map((q,i)=>q.section===s?i:-1).filter(i=>i>=0),n=indexes.filter(i=>right(bank.questions[i],a.answers[i])).length;return `<div class="list-row row between wrap"><h3>${esc(s)}</h3><span class="pill lime">${n}/${indexes.length} đúng</span></div>`;}).join('')}</main>`;window.scrollTo(0,0);}
 async function history(id){const h=state.history.find(h=>h.id===id);if(!h)return;await load(h.test);review=JSON.parse(JSON.stringify(h));result();}
 document.addEventListener('click',async e=>{const el=e.target.closest('[data-exam]');if(!el||el.disabled||busy)return;try{const action=el.dataset.exam;if(action==='close'){modal.close();return;}if(state.active&&view==='test'&&expire())return;switch(action){case'prepare':prepare(Number(el.dataset.test));break;case'start':await start(Number(el.dataset.test),el.dataset.mode);break;case'resume':await resume();break;case'answer':choose(Number(el.dataset.index));break;case'check':{const a=state.active;if(view!=='test'||!untimed(a)||(window.DailyGate&&!window.DailyGate.allow()))break;if(a.answers[a.pos].length!==bank.questions[a.pos].correct.length)break;a.checked??=Array(65).fill(false);a.checked[a.pos]=true;const correct=right(bank.questions[a.pos],a.answers[a.pos]);if(!correct){a.everWrong??=Array(65).fill(false);a.everWrong[a.pos]=true;}save();window.DailyGate?.recordExamAnswer(bank.id,a.pos+1,correct);renderQuestion();break;}case'jump':{const a=view==='review'?review:state.active,n=Number(el.dataset.index);if(a&&n>=0&&n<65){a.pos=n;if(view==='test')save();renderQuestion();scrollToQuestion();}break;}case'flag':if(state.active&&view==='test'){state.active.flags[state.active.pos]=!state.active.flags[state.active.pos];save();renderQuestion();}break;case'clear':if(state.active&&view==='test'){state.active.answers[state.active.pos]=[];if(state.active.checked)state.active.checked[state.active.pos]=false;save();renderQuestion();}break;case'filter':filter=el.dataset.filter;renderQuestion();break;case'confirm':confirm();break;case'submit':submit();break;case'history':await history(el.dataset.id);break;case'review':view='review';filter='all';review.pos=0;renderQuestion();break;case'result':result();break;case'hub':hub();break;}}catch(err){hub();warning(err.message||'Không mở được bài thi. Vui lòng thử lại.');}});
 window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const s=JSON.parse(e.newValue);if(validState(s)){state=s;modal.close();hub();if(state.active)resume().catch(e=>warning(e.message));}}catch{}});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)clock();});
 setInterval(clock,1000);hub();if(state.active)resume().catch(e=>{hub();warning(e.message);});
 if(qa)window.Exam={get state(){return state;},get bank(){return bank;},start,choose,submit,resume,history,clock,reset(){state={version:1,active:null,history:[]};save();modal.close();hub();}};
})();
</script></body></html>
